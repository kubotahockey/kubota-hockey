{% extends "base.html" %}
{% block title %}{{ heading }} — Kubota Hockey{% endblock %}

{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ heading }}</h1>
  <p class="mt-3">{{ message }}</p>
  <div class="hero-actions" style="justify-content:center;">
    <a href="{{ url_for('home') }}" class="btn btn-primary">Back to the projections</a>
    <a href="{{ url_for('player_page') }}" class="btn btn-outline-light">Look up a player</a>
  </div>
</div>
{% endblock %}
